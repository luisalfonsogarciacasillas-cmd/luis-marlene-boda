<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luis &amp; Marlene | Una invitación especial</title>
<meta property="og:type" content="website"><meta property="og:title" content="Luis &amp; Marlene | Nuestra Boda">
<meta property="og:description" content="Una invitación especial para ustedes. 19 de diciembre de 2026.">

<style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f4ede3;color:#86503e;text-align:center;font-family:Georgia,serif;padding:20px;box-sizing:border-box}.card{max-width:500px;padding:50px 26px;border:1px solid #b99a6a;background:#fbf7f1;box-shadow:0 16px 55px #382a2510}.mark{font-size:28px;letter-spacing:.1em;color:#b99a6a}h1{font-size:clamp(36px,8vw,56px);font-weight:normal;margin:22px 0}p{line-height:1.7}.hint{font-size:14px;color:#7a665c}a{color:#86503e}</style></head>
<body><main class="card"><div class="mark">L &amp; M</div><h1>Luis &amp; Marlene</h1><p>Una invitación especial para ustedes</p><p class="hint" id="status" role="status">Preparando su invitación…</p></main>
<script>
(function(){
'use strict';
// PEGAR AQUÍ LA URL /exec DEL NUEVO SCRIPT ShortLinks (NO del RSVP).
const RESOLVER_URL='https://script.google.com/macros/s/AKfycbwEPRQqyQ1enZkQ3D9cVeWDvwC2yROF76y_heGY-81Ah8I6W5MzAla2AquknKQMm8QD/exec';
const BASE='https://luisalfonsogarciacasillas-cmd.github.io/luis-marlene-boda/';
const id=new URLSearchParams(location.search).get('id');
const status=document.getElementById('status');
if(!id||!/^[a-z0-9]{8,16}$/.test(id)){status.textContent='Este enlace no es válido. Soliciten uno nuevo a los novios.';return;}
if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(RESOLVER_URL)){
 status.textContent='Enlace de prueba: falta configurar el servicio de enlaces cortos.';return;
}
let resolved=false;
window.LMShortLinksResolve=function(data){
 if(resolved)return;resolved=true;
 if(!data||data.ok!==true||typeof data.token!=='string'||!/^[a-f0-9]{64}$/.test(data.token)){
   status.textContent='No encontramos esta invitación. Contacten a los novios.';return;
 }
 // El token se entrega al navegador del portador del enlace; no es secreto frente a él.
 location.replace(BASE+'?invite='+encodeURIComponent(data.token));
};
const script=document.createElement('script');
script.src=RESOLVER_URL+'?id='+encodeURIComponent(id);
script.onerror=()=>{status.textContent='No pudimos abrir la invitación. Inténtenlo de nuevo.';};
document.head.appendChild(script);
setTimeout(()=>{if(!resolved)status.textContent='La conexión está tardando. Actualicen la página para intentar de nuevo.';},12000);
})();
</script></body></html>
