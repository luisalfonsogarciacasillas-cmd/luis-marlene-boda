<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4ede3">
<title>Luis &amp; Marlene | Una invitación especial</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Luis &amp; Marlene | Nuestra Boda">
<meta property="og:description" content="Una invitación especial para ustedes. 19 de diciembre de 2026.">
<meta property="og:image" content="https://luisalfonsogarciacasillas-cmd.github.io/luis-marlene-boda/preview-whatsapp.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f4ede3}
body{min-height:100svh;display:grid;place-items:center;font-family:Georgia,serif;color:#86503e}
.loader{width:38px;height:38px;display:grid;place-items:center;position:relative;opacity:.8}
.loader:before{content:"";position:absolute;inset:3px;border:1px solid rgba(185,154,106,.35);border-radius:50%;animation:breathe 2.2s ease-in-out infinite}
.sparkle{color:#b99a6a;font-size:22px;line-height:1;animation:twinkle 2.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.85) rotate(-10deg)}50%{opacity:1;transform:scale(1.12) rotate(10deg)}}
@keyframes breathe{0%,100%{opacity:.3;transform:scale(.82)}50%{opacity:.85;transform:scale(1.15)}}
@media(prefers-reduced-motion:reduce){.loader:before,.sparkle{animation:none}}
.message{display:none;text-align:center;max-width:390px;padding:28px;line-height:1.7;font-size:16px}
body.has-error .loader{display:none}
body.has-error .message{display:block}
</style>
</head>
<body>
<div class="loader" aria-hidden="true"><span class="sparkle">✧</span></div>
<p class="message" id="status" role="status" aria-live="polite"></p>
<script>
(function(){
'use strict';
const RESOLVER_URL='https://script.google.com/macros/s/AKfycbwEPRQqyQ1enZkQ3D9cVeWDvwC2yROF76y_heGY-81Ah8I6W5MzAla2AquknKQMm8QD/exec';
const BASE='https://luisalfonsogarciacasillas-cmd.github.io/luis-marlene-boda/';
const id=new URLSearchParams(location.search).get('id');
const status=document.getElementById('status');
let finished=false;
function showError(message){
  if(finished)return;
  finished=true;
  status.textContent=message;
  document.body.classList.add('has-error');
}
if(!id||!/^[a-z0-9]{8,16}$/.test(id)){
  showError('Este enlace no es válido. Soliciten uno nuevo a los novios.');
  return;
}
window.LMShortLinksResolve=function(data){
  if(finished)return;
  if(!data||data.ok!==true||typeof data.token!=='string'||!/^[a-f0-9]{64}$/.test(data.token)){
    showError('No encontramos esta invitación. Contacten a los novios.');
    return;
  }
  finished=true;
  location.replace(BASE+'?invite='+encodeURIComponent(data.token));
};
const script=document.createElement('script');
script.src=RESOLVER_URL+'?id='+encodeURIComponent(id);
script.onerror=function(){showError('No pudimos abrir la invitación. Inténtenlo de nuevo.');};
document.head.appendChild(script);
setTimeout(function(){showError('La conexión está tardando. Actualicen la página para intentar de nuevo.');},12000);
})();
</script>
</body>
</html>
